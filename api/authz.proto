syntax = "proto3";

package authz.v1;

// Maps to your public pkg directory for easy client SDK imports
option go_package = "github.com/casuncio/bouncer-engine/pkg/gen/authzv1";

service AuthorizationService {
  rpc CheckAccess (CheckAccessRequest) returns (CheckAccessResponse);
  rpc StreamPolicyUpdates (stream PolicyUpdateRequest) returns (PolicyUpdateResponse);
}

// Wrapper to support multi-value attributes (e.g., roles=["admin", "editor"])
message AttributeValues {
  repeated string values = 1;
}

message CheckAccessRequest {
  string principal_id = 1;
  map<string, AttributeValues> principal_attributes = 2; 
  string resource_type = 3;
  string resource_id = 4;
  map<string, AttributeValues> resource_attributes = 5;  
  string action = 6;                            
  map<string, AttributeValues> environment_attributes = 7;
}

message CheckAccessResponse {
  bool allowed = 1;
  string matched_policy_id = 2;
  string reason = 3;
  int64 evaluation_time_ns = 4;
}

message PolicyUpdateRequest {
  string policy_id = 1;
  string action = 2; // "UPSERT" or "DELETE"
  string policy_json = 3;
}

message PolicyUpdateResponse {
  bool success = 1;
  int32 active_policy_count = 2;
}