name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Build, Test, and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Engine
        # Ensures the standalone binary compiles without errors
        run: make build

      - name: Run Unit Tests
        # Executes your race-detector enabled test suite
        run: make test

      - name: Run Performance Benchmarks
        # Validates your zero-allocation parsing constraints
        run: make bench
